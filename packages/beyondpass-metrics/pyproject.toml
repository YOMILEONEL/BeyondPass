[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyondpass-metrics"
version = "0.1.0"
description = "Token-based structural program-similarity metrics (POS/PPS/PSS/PES) for Python AST"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/YOMILEONEL/BeyondPass"
Source = "https://github.com/YOMILEONEL/BeyondPass/tree/main/packages/beyondpass-metrics"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
