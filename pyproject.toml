[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyondpass"
version = "0.1.0"
description = "Multi-Agent-Code-Synthese mit strukturgesteuertem Feedback-Loop"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "datasets>=2.19",
    "docker>=7.0",
    "anthropic>=0.40",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
dashboard = [
    "streamlit>=1.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "docker: tests that require a running Docker daemon",
]

[tool.mypy]
# Kein explizites `python_version`-Pin: das zwingt mypy, auch fremde,
# mitgelieferte Typ-Stubs (z. B. numpy) gegen eine niedrigere Syntaxversion
# zu pruefen als die tatsaechlich installierte/laufende (3.12), was dort zu
# falschen Syntaxfehlern fuehrt (PEP-695-`type`-Statements in numpys .pyi).
# Ohne Pin nutzt mypy die Version des Interpreters, der es ausfuehrt.

# `docker` und `datasets` liefern keine Typ-Stubs/`py.typed`-Marker mit.
[[tool.mypy.overrides]]
module = ["docker.*", "datasets.*"]
ignore_missing_imports = true

# `streamlit` ist nur im optionalen `dashboard`-Extra, nicht in `dev` --
# CI installiert nur `.[dev]`, also ist es dort schlicht nicht installiert.
[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true
